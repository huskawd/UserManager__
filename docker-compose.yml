services:
  db:
    image: mysql:8.4

    container_name: usermanager-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usermanager

    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin

    container_name: usermanager-phpmyadmin

    restart: unless-stopped

    depends_on:
      - db

    environment:
      PMA_HOST: db

    ports:
      - "8080:80"